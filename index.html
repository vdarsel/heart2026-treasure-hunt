  <!--
  ============================= FIREBASE SETUP — READ ME FIRST =============================
  This app needs a free Firebase Realtime Database so every phone can share the same
  teams, photos and leaderboard. Takes about 10 minutes, no coding, no credit card:

  1. Go to https://console.firebase.google.com and sign in with any Google account.
  2. Click "Add project", give it any name, finish the wizard (Analytics can be off).
  3. In the left menu: Build > Realtime Database > "Create Database".
     - Pick a region close to your event (e.g. Europe) and continue.
     - Choose "Start in test mode" if offered (or "locked mode", see step 4).
  4. Click the "Rules" tab of the Realtime Database and paste exactly this, then "Publish":
       {
         "rules": {
           ".read": true,
           ".write": true
         }
       }
     This makes the data open to anyone with your database URL — fine for a short,
     low-stakes event. Delete the Firebase project once the hunt is over if you'd rather
     not leave it open.
  5. Click the gear icon (top left) > "Project settings" > scroll to "Your apps" >
     click the "</>" (web) icon > register an app (any nickname, no need for Hosting).
  6. Firebase shows you a `firebaseConfig` object. Copy its values into the block below,
     replacing every "PASTE_..." placeholder. Save this file, then upload it to whatever
     web host you're using (GitHub Pages, Netlify, your own server, etc.).
  ============================================================================================
-->

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Public+Sans:wght@400;500;600;700&family=Space+Mono:wght@400;700&display=swap');

    :root {
      --paper: #F1ECDD;
      --paper-2: #E8E1CC;
      --ink: #1E241F;
      --ink-soft: #4B5148;
      --bleu: #14304A;
      --vert: #1F6E4B;
      --alerte: #A6432B;
      --or: #A87F2E;
      --white: #FFFDF7;

      padding: 0;

      margin: 0 auto;
      padding: 0 14px;
    }

    .warning-banner {
      background: #FFF3E0;
      border: 2px solid var(--alerte);
      border-radius: 4px;

      color: var(--ink);

    }

    .warning-banner code {

      border-radius: 3px;

    .live-dot {
      display: inline-block;
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--vert);
      margin-right: 6px;
    }


    /* ---------- Mission map ---------- */
    .mission-map-wrap {

      border-radius: var(--radius);

    .map-attribution {

    .map-number {

    .btn {

      align-items: center;

    .cluster-heading::after {

      flex: 1;
      border-top: 1px dashed var(--ink-soft);
    }

    /* ---------- Mission cards ---------- */
    .stop-card {
      position: relative;
    }

    .stop-top {
      display: flex;
      align-items: flex-start;
      gap: 12px;
    }

    .stop-num {
      flex: 0 0 auto;
      width: 38px;
      height: 38px;
      border-radius: 50%;
      border: 2px solid var(--ink);
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: var(--mono);
      font-weight: 700;
      font-size: 13px;
      background: var(--paper);
    }

    .stop-meta {
      flex: 1;
    }

    .stop-meta .teaser {
      color: var(--ink-soft);
      font-size: 13.5px;
    }

    .stop-points {
      font-family: var(--mono);
      font-weight: 700;
      color: var(--or);
      font-size: 14px;
      white-space: nowrap;

    .precta {
      background: var(--paper);
      border: 1.5px dashed var(--ink-soft);

    .memo-box {

      font-family: var(--mono);
      font-weight: 700;
      font-size: 11.5px;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--vert);
      margin-bottom: 4px;

    .mission-box .mission-text {
      font-size: 14px;
    }

    .status-pill {
      display: inline-block;
      font-family: var(--mono);
      font-size: 11px;
      text-transform: uppercase;
      padding: 3px 10px;
      border-radius: 10px;
      margin-top: 8px;

    .status-pill.todo {

    .status-pill.pending {

    .status-pill.approved {

      color: #fff;
    }

    .status-pill.refused {
      background: var(--alerte);

    .stamp {
      position: absolute;
      top: 10px;
      right: 10px;
      width: 78px;
      height: 78px;
      border-radius: 50%;

      align-items: center;
      justify-content: center;

      max-height: 220px;

    /* ---------- Leaderboard ---------- */
    .rank-row {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 10px 0;
      border-bottom: 1px dashed var(--paper-2);

    .rank-row:last-child {

    .rank-num {

    .elapsed {

    /* ---------- Admin ---------- */
    .pin-row {
      display: flex;
      gap: 8px;
    }

    .pin-row input {
      flex: 1;
      margin: 0;

    .mod-card {
      position: relative;
    }

    .mod-header {
      display: flex;

      align-items: center;
      gap: 8px;

    .mod-note {

    .comment-input {

    .arrival-row {
      display: flex;

      border-bottom: 1px dashed var(--paper-2);
      flex-wrap: wrap;
    }

    .arrival-row:last-child {
      border-bottom: none;

    .empty-state {
      text-align: center;

    .loading {
      text-align: center;

      text-align: center;
      font-size: 12px;
      color: var(--ink-soft);
      margin: 24px 0 8px;

  </style>

  <script>
    (function () {


      /* ============================= FIREBASE CONFIG =============================
        Replace every "PASTE_..." value below with the config Firebase gave you
        (Project settings > General > Your apps). See the setup notes at the very
        top of this file for the full walkthrough.
      
        NOTE: your previous config got wiped down to "{blur}" at some point (looks
        like an accidental find-and-replace before uploading) — paste your real
        values back in below, or nothing will save. */
      const firebaseConfig = {
        apiKey: "PASTE_YOUR_API_KEY_HERE",
        authDomain: "PASTE_YOUR_PROJECT.firebaseapp.com",
        databaseURL: "https://PASTE_YOUR_PROJECT-default-rtdb.firebaseio.com",
        projectId: "PASTE_YOUR_PROJECT",
        storageBucket: "PASTE_YOUR_PROJECT.appspot.com",
        messagingSenderId: "PASTE_YOUR_SENDER_ID",
        appId: "PASTE_YOUR_APP_ID"
      };
      const CONFIG_IS_PLACEHOLDER = firebaseConfig.apiKey === "PASTE_YOUR_API_KEY_HERE";
      let db = null;
      if (!CONFIG_IS_PLACEHOLDER && typeof firebase !== 'undefined') {
        firebase.initializeApp(firebaseConfig);
        db = firebase.database();
      }

/* ============================= HUNT CONFIG =============================
   Everything that is specific to *this* hunt (city, wording, map, admin
   check) lives here, so you can reuse the file for another event by
   editing this block + the LOCATIONS / BONUS_ACTIONS / MISSION_MAP_POINTS
   data below. See README.md for the full checklist. */
const HUNT_CONFIG = {
  pageTitle:      'Paris Scavenger Hunt — Notre-Dame to Jussieu', // browser tab title
  eyebrow:        'Left Bank · 5th & 6th arrondissements',        // small line above the title
  title:          'Paris Scavenger Hunt',                         // big title in the header
  subtitle:       'Start anywhere · Finish at Sorbonne Université, Jussieu',
  finishShort:    'Jussieu',                                      // used in "head to …!" and late-penalty text
  finishLong:     'Sorbonne Université, Jussieu',                 // used on the Missions map note
  mapCenter:      [2.3522, 48.8566],                              // [longitude, latitude]
  mapZoom:        12,

  // How the admin PIN is checked:
  //   'php'   -> the PIN lives ONLY in index.php on your server (needs PHP hosting)
  //   'local' -> the PIN is written below, in this file (works on any static host,
  //              but anyone who views the page source can read it)
  adminMode:      'php',
  adminEndpoint:  'index.php',                                    // file that checks the PIN in 'php' mode (rename it if 'index.php' clashes with your home page)
  localAdminPin:  '2026'                                          // only used when adminMode is 'local'
};

      /* ============================= DATA ============================= */
      /* Point scale: adjust to your needs */

      const LOCATIONS = [
        // ---- Cluster: Latin Quarter — the home stretch ----
        {
          id: 'pantheon', cluster: 'Latin Quarter — the home stretch', points: 100,
          name: 'The Panthéon', place: 'Place du Panthéon',
          memo: `The Panthéon was originally built as a church dedicated to Saint Geneviève, the patron saint of Paris, and was later transformed into a national mausoleum. Famous people buried here include Marie Curie, Victor Hugo, Alexandre Dumas and Voltaire.

For a group of scientists, one connection stands out: in 1851, physicist Léon Foucault suspended a 28 kg pendulum from the dome to demonstrate — for the first time, with no telescope and no astronomy — that the Earth rotates. As the pendulum swings, its plane of motion appears to drift, about 11° per hour in Paris, because the building (and the ground under it) is slowly turning beneath it, not the pendulum itself. Parisians queued for hours to watch it; the invitation to the first demonstration reportedly urged visitors to "come and see the Earth turn."`,
          question: 'Look at the front of the Panthéon. How many large columns support the triangular pediment?',
          answerKey: '22.',
          photoTask: 'Recreate a scientific experiment with your team in front of the Panthéon.'
        },

              const scale = Math.min(1, maxW / img.width);
              const w = Math.max(1, Math.round(img.width * scale));
              const h = Math.max(1, Math.round(img.height * scale));
              const canvas = document.createElement('canvas');
              canvas.width = w; canvas.height = h;
              const ctx = canvas.getContext('2d');
              ctx.drawImage(img, 0, 0, w, h);
              resolve(canvas.toDataURL('image/jpeg', 0.6));
            };
            img.onerror = () => reject(new Error('image decode failed'));
            img.src = e.target.result;
          };
          reader.onerror = () => reject(new Error('file read failed'));
          reader.readAsDataURL(file);
        });
      }

        if (!state.currentTeamId) { alert('Create or join your team on the Home tab first.'); return; }
        const item = getItem(itemId);
        const fileInput = document.getElementById('file-' + itemId);
        const file = fileInput && fileInput.files && fileInput.files[0];
        let note = '';
        const select = document.getElementById('select-' + itemId);
        const noteInput = document.getElementById('note-' + itemId);
        if (select) note = select.value;
        else if (noteInput) note = noteInput.value.trim();
        const team = state.teams.find(t => t.id === state.currentTeamId);

        // Repeatable bonus (plaques): unchanged — one fresh record per plaque found.
        if (item.repeatable) {
          if (!file) { alert('Add a photo before sending your proof!'); return; }
          state.submitting[itemId] = true; render();
          try {
            const photoData = await compressImage(file);
            const id = genId();
            const submission = {
              id: id, teamId: state.currentTeamId, teamName: team ? team.name : '?',
              itemId: itemId, itemName: item ? item.name : itemId,
              photo: photoData, note: note, timestamp: Date.now(), status: 'pending', moderatorComment: ''
            };
            await db.ref('submissions/' + id).set(submission);
            if (fileInput) fileInput.value = '';
          } catch (e) {
            console.error(e);
            alert(storageErrorMessage('send your proof', e));
          }
          state.submitting[itemId] = false;
          render();
          return;
        }

        // Normal spots: one record per team+item (deterministic key), photo and
        // answer are graded independently, so resubmitting only touches whichever
        // part isn't approved yet.
        const key = state.currentTeamId + '__' + itemId;
        const existing = getMySubmission(itemId);

        let photoStatus, photoComment;
        if (file) {
          photoStatus = 'pending'; photoComment = '';
        } else if (existing && existing.photoStatus === 'approved') {
          photoStatus = 'approved'; photoComment = existing.photoComment || '';
        } else {
          alert('Add a photo before sending your proof!'); return;
        }

        const hasQuestion = item.questionPoints > 0;
        let questionStatus, questionComment;
        if (!hasQuestion) {
          questionStatus = 'none'; questionComment = '';
        } else if (existing && existing.questionStatus === 'approved' && note === existing.note) {
          questionStatus = 'approved'; questionComment = existing.questionComment || '';
        } else {
          questionStatus = 'pending'; questionComment = '';
        }

        state.submitting[itemId] = true; render();
        try {
          const photoData = file ? await compressImage(file) : existing.photo;
          const submission = {
            id: key, teamId: state.currentTeamId, teamName: team ? team.name : '?',
            itemId: itemId, itemName: item ? item.name : itemId,
            photo: photoData, photoStatus: photoStatus, photoComment: photoComment,
            note: note, questionStatus: questionStatus, questionComment: questionComment,
            timestamp: Date.now()
          };
          await db.ref('submissions/' + key).set(submission);
          if (fileInput) fileInput.value = '';
        } catch (e) {
          console.error(e);
          alert(storageErrorMessage('send your proof', e));
        }
        state.submitting[itemId] = false;
        render();

      async function tryUnlockModo() {
        const input = document.getElementById('modo-pin-input');

  if(!val){ alert('Type the PIN first.'); return; }

  // Mode "local": the PIN is in HUNT_CONFIG (simple, but visible in the page source).
  if(HUNT_CONFIG.adminMode === 'local'){
    if(val === HUNT_CONFIG.localAdminPin){
      state.modoUnlocked = true;
      render();
    } else {
      alert('Incorrect code.');
    }
    return;
  }

  // Mode "php": the PIN is checked on the server by login.php and never sent to the browser.
  try{
    const res = await fetch(HUNT_CONFIG.adminEndpoint, {
      method:'POST',
      headers:{'Content-Type':'application/x-www-form-urlencoded'},
      body:'pin='+encodeURIComponent(val)
          });
          const data = await res.json();
          if (data && data.success) {
            state.modoUnlocked = true;
            render();
          } else {
            alert('Incorrect code.');

      /* ============================= SCORING ============================= */
      function scoreForTeam(teamId) {
        let pts = 0, count = 0;
        ALL_ITEMS.forEach(item => {
          if (item.repeatable) {
            const approved = state.submissions.filter(s => s.teamId === teamId && s.itemId === item.id && s.status === 'approved');
            const n = Math.min(approved.length, item.maxCount || 99);
            pts += n * item.points; count += n;
            return;
          }
          const sub = state.submissions.find(s => s.teamId === teamId && s.itemId === item.id);
          if (!sub) return;
          let itemPts = 0, touched = false;
          if (sub.photoStatus === 'approved') {
            itemPts += item.photoPoints; touched = true;
            // Answer points only count once the photo itself is validated.
            if (item.questionPoints > 0 && sub.questionStatus === 'approved') { itemPts += item.questionPoints; }
          }
          if (touched) { pts += itemPts; count += 1; }
        });
        return { points: pts, count: count };
      }

      function latenessForTeam(team) {
        if (!state.game.startedAt || !team.arrivedAt) return { lateMin: 0, penalty: 0 };
        const deadline = state.game.startedAt + HUNT_DURATION_MS;
        const lateMin = Math.max(0, Math.ceil((team.arrivedAt - deadline) / 60000));
        return { lateMin: lateMin, penalty: lateMin * LATE_PENALTY_PER_MIN };
      }

      function fmtElapsed(ms) {
        const totalSec = Math.max(0, Math.floor(ms / 1000));
        const h = Math.floor(totalSec / 3600);
        const m = Math.floor((totalSec % 3600) / 60);
        const s = totalSec % 60;
        if (h > 0) return h + ':' + String(m).padStart(2, '0') + ':' + String(s).padStart(2, '0');
        return String(m).padStart(2, '0') + ':' + String(s).padStart(2, '0');
      }
      function fmtClock(ts) {
        const d = new Date(ts);
        return String(d.getHours()).padStart(2, '0') + ':' + String(d.getMinutes()).padStart(2, '0');
      }

        { id: 'saint-germain', lat: 48.8539, lng: 2.3338 },
        { id: 'assemblee-nationale', lat: 48.862431649201675, lng: 2.318964457498287 },
        { id: 'musee-orsay', lat: 48.860558628028265, lng: 2.325202943023087 },
        { id: 'saint-germain', lat: 48.8539, lng: 2.3338 },

        { id: 'louvre-pyramid', lat: 48.86104408950226, lng: 2.335695618044757 },
        { id: 'buren-columns', lat: 48.86347547948367, lng: 2.3370247286627674 },
        { id: 'place-vendome', lat: 48.8675, lng: 2.3294 },
        { id: 'rue-de-rivoli', lat: 48.86343794754758, lng: 2.331716366266461 }
      ];

      let missionMap = null;
      let maplibreLoadingPromise = null;

      function loadMapLibre() {
        if (window.maplibregl) return Promise.resolve();

        if (maplibreLoadingPromise) return maplibreLoadingPromise;

        maplibreLoadingPromise = new Promise((resolve, reject) => {
          if (!document.getElementById('maplibre-css')) {
            const css = document.createElement('link');
            css.id = 'maplibre-css';
            css.rel = 'stylesheet';
            css.href = 'https://unpkg.com/maplibre-gl@5.24.0/dist/maplibre-gl.css';
            document.head.appendChild(css);
          }

          const script = document.createElement('script');

          /*
           * v5 is used here because it still provides a classic browser build.
           * Current MapLibre v6 is ESM-only.
           */
          script.src = 'https://unpkg.com/maplibre-gl@5.24.0/dist/maplibre-gl.js';

          script.onload = () => {
            if (window.maplibregl) {
              resolve();
            } else {
              reject(new Error('MapLibre loaded but maplibregl is unavailable.'));
            }
          };

          script.onerror = () => {
            reject(new Error('Could not load MapLibre GL JS.'));
          };

          document.head.appendChild(script);
        });

        return maplibreLoadingPromise;
      }

      function makeMissionMarker(number) {
        const el = document.createElement('div');

        el.className = 'map-marker';
        el.textContent = number;

        return el;
      }

      function initMissionMap() {
        const mapElement = document.getElementById('mission-map');

        if (!mapElement) return;

        loadMapLibre().then(() => {

          /*
           * The Missions DOM can be rebuilt every time the page renders.
           * Make sure we remove the previous MapLibre instance first.
           */
          if (missionMap) {
            try {
              missionMap.remove();
            } catch (e) { }
            missionMap = null;
          }

          missionMap = new maplibregl.Map({
            container: mapElement,

            style: 'https://tiles.openfreemap.org/styles/liberty',

            center: [2.3522, 48.8566],
            zoom: 12,

            attributionControl: true
          });

          const bounds = new maplibregl.LngLatBounds();

          missionMap.on('load', () => {

            MISSION_MAP_POINTS.forEach((point) => {

              const item = getItem(point.id);

              if (!item) return;

              const index =
                LOCATIONS.findIndex(x => x.id === point.id) + 1;

              /* ---------- Numbered marker ---------- */

              const marker = new maplibregl.Marker({
                element: makeMissionMarker(index)
              })
                .setLngLat([point.lng, point.lat])
                .addTo(missionMap);

              /* ---------- Popup ---------- */

              const popup = new maplibregl.Popup({
                offset: 18,
                closeButton: true,
                closeOnClick: true,
                maxWidth: '250px'
              }).setHTML(`
          <div class="map-popup-title">
            ${esc(item.name)}
          </div>

          <div>
            ${esc(item.place)}
          </div>

          <div class="map-popup-points">
            +${item.points} pts
          </div>
        `);

              marker.setPopup(popup);

              /* ---------- Bounds ---------- */

              bounds.extend([point.lng, point.lat]);
            });

            if (!bounds.isEmpty()) {
              missionMap.fitBounds(bounds, {
                padding: {
                  top: 40,
                  bottom: 40,
                  left: 40,
                  right: 40
                },
                maxZoom: 14,
                duration: 0
              });
            }
          });

        }).catch(err => {

          console.error('Mission map error:', err);

          const el = document.getElementById('mission-map');

          if (el) {
            el.innerHTML = `
        <div style="
          padding:20px;
          text-align:center;
          color:var(--ink-soft);
        ">
          Map could not be loaded.
          Please check your internet connection.
        </div>`;
          }
        });
      }


      function renderMissions() {
        if (!state.currentTeamId) {
          return `
      <div class="card empty-state">
        Create or join your team on the <b>Home</b> tab to unlock the missions.
      </div>`;
        }

        let html = '';
        let n = 1;

        /* ---------- Interactive map ---------- */
        html += `
    <div class="mission-map-wrap">
      <h2>🗺️ Choose your route</h2>

      <div class="mission-map-note">
        There are 24 locations to explore. You do <b>not</b> need to visit them all.
        Choose your own route and finish at Sorbonne Université, Jussieu.
      </div>

      <div id="mission-map"></div>
      <div class="map-attribution">
        Map data © OpenStreetMap contributors · Map style © OpenFreeMap
      </div>

      <div class="mission-map-legend">
        <span class="map-legend-item">
          Click a marker to see the location
        </span>
        <span class="map-legend-item">
          📍 24 optional locations
        </span>
        <span class="map-legend-item">
          🎯 Choose your strategy
        </span>
      </div>
    </div>
  `;

        /* ---------- Mission cards ---------- */
        CLUSTER_ORDER.forEach(clusterName => {
          const items = LOCATIONS.filter(l => l.cluster === clusterName);

          if (!items.length) return;

          html += `
      <div class="cluster-heading">
        ${esc(clusterName)}
      </div>`;

          items.forEach(item => {
            html += renderItemCard(item, n);
            n++;
          });
        });

        /*
         * IMPORTANT:
         * BONUS_ACTIONS are intentionally NOT shown here.
         *
         * The map and the Missions tab therefore contain only LOCATIONS.
         */

        return html;
      }

      function renderAdditionalMissions() {
        if (!state.currentTeamId) {
          return `
      <div class="card empty-state">
        Create or join your team on the <b>Home</b> tab to unlock the missions.
      </div>`;
        }

        let html = '';
        let n = 1;

        /* ---------- Interactive map ---------- */
        html += `
    <div class="mission-map-wrap">
      <h2>🗺️ Choose your route</h2>

      <div class="mission-map-note">
        There are 5 additional missions to fulfil. You can complete one of these at any time during your treasure hunt !
      </div>`


        /* ---------- Mission cards ---------- */

        html += `
      <div class="cluster-heading">
        Bonus Missions
      </div>`;

        BONUS_ACTIONS.forEach(item => {
          html += renderItemCard(item, n);
          n++;
        });

        /*
         * IMPORTANT:
         * BONUS_ACTIONS are intentionally NOT shown here.
         *
         * The map and the Missions tab therefore contain only LOCATIONS.
         */

        return html;
      }

      function renderLeaderboard() {
        const rows = state.teams.map(t => {
          const sc = scoreForTeam(t.id);
          const late = latenessForTeam(t);
          const net = Math.max(0, sc.points - late.penalty);
          return { team: t, gross: sc.points, count: sc.count, ...late, net };
        }).sort((a, b) => b.net - a.net || b.gross - a.gross || a.team.createdAt - b.team.createdAt);

        const list = rows.length ? rows.map((r, i) => {
          let arrivalLine;
          if (!r.team.arrivedAt) {
            arrivalLine = `<span class="elapsed">Still out on the hunt</span>`;
          } else if (r.lateMin > 0) {
            arrivalLine = `<span class="elapsed late-tag">Arrived ${fmtClock(r.team.arrivedAt)} · ${r.lateMin} min late · -${r.penalty} pts</span>`;
          } else {
            arrivalLine = `<span class="elapsed">Arrived ${fmtClock(r.team.arrivedAt)} · on time</span>`;
          }
          return `
    <div class="rank-row ${i === 0 ? 'first' : ''}">
      <div class="rank-num">${i === 0 ? '🥇' : i === 1 ? '🥈' : i === 2 ? '🥉' : (i + 1)}</div>
      <div>
        <span class="plaque-badge">${esc(r.team.name)}</span>
        ${arrivalLine}
      </div>
      <div class="rank-score">
        <div class="pts">${r.net} pts</div>
        <div class="stops">${r.count} mission${r.count === 1 ? '' : 's'} approved</div>
      </div>
    </div>`;
        }).join('') : `<div class="empty-state">No teams yet.</div>`;

        return `
    <div class="card">
      <h2><span class="live-dot"></span>Live leaderboard</h2>
      <div style="margin-top:10px;">${list}</div>
      <p class="muted" style="margin-top:10px;">Updates instantly for everyone. Scores for teams still out on the hunt are provisional — the late penalty only applies once an organizer logs your arrival.</p>
    </div>`;
      }

      function renderAdmin() {
        if (!state.modoUnlocked) {
          return `
    ${renderStorageBanner()}
    <div class="card">
      <h2>Organizer area</h2>
      <p class="muted">For the organizing team only: start the hunt, log arrivals, and review submitted proof.</p>
      <label>Admin PIN</label>
      <div class="pin-row">
        <input type="text" id="modo-pin-input" placeholder="PIN">
        <button class="btn btn-primary" data-action="modo-unlock">Unlock</button>
      </div>
    </div>`;
        }

        const huntControl = state.game.startedAt ? `
    <div class="card">
      <h2>Hunt control</h2>
      <p class="muted">Started at ${fmtClock(state.game.startedAt)}. Deadline: ${fmtClock(state.game.startedAt + HUNT_DURATION_MS)}.</p>
    </div>` : `
    <div class="card">
      <h2>Hunt control</h2>
      <p class="muted">The 2-hour clock hasn't started yet.</p>
      <button class="btn btn-primary btn-block" data-action="start-hunt">▶ Start the 2-hour clock</button>
    </div>`;

        const teamsHtml = state.teams.length ? state.teams.map(t => {
          const late = latenessForTeam(t);
          return `
    <div class="arrival-row">
      <span class="plaque-badge">${esc(t.name)}</span>
      ${t.arrivedAt
              ? `<span class="muted">Arrived ${fmtClock(t.arrivedAt)}${late.lateMin > 0 ? ` · ${late.lateMin} min late (-${late.penalty} pts)` : ' · on time'}</span>
           <button class="btn btn-secondary" style="margin-left:auto;" data-action="unmark-arrived" data-id="${t.id}">Undo</button>`
              : `<button class="btn btn-primary" style="margin-left:auto;" data-action="mark-arrived" data-id="${t.id}">Mark arrived now</button>`}
    </div>`;
        }).join('') : `<p class="muted">No teams registered yet.</p>`;

        const pendingNormal = state.submissions.filter(s => {
          const item = getItem(s.itemId);
          if (!item || item.repeatable) return false;
          return s.photoStatus === 'pending' || (item.questionPoints > 0 && s.questionStatus === 'pending');
        }).sort((a, b) => a.timestamp - b.timestamp);

        const pendingPlaques = state.submissions.filter(s => {
          const item = getItem(s.itemId);
          return item && item.repeatable && s.status === 'pending';
        }).sort((a, b) => a.timestamp - b.timestamp);

        const doneNormal = state.submissions.filter(s => {
          const item = getItem(s.itemId);
          if (!item || item.repeatable) return false;
          return s.photoStatus !== 'pending' && (item.questionPoints === 0 || s.questionStatus !== 'pending');
        }).sort((a, b) => b.timestamp - a.timestamp);

        const donePlaques = state.submissions.filter(s => {
          const item = getItem(s.itemId);
          return item && item.repeatable && s.status !== 'pending';
        }).sort((a, b) => b.timestamp - a.timestamp);

        const pendingNormalHtml = pendingNormal.map(s => {
          const item = getItem(s.itemId);
          const photoBlock = s.photoStatus === 'pending' ? `
      <div class="mod-note">📸 Photo — pending</div>
      <input type="text" class="comment-input" id="photo-comment-${s.id}" placeholder="Comment on the photo (optional)">
      <div class="btn-row" style="margin-top:6px;">
        <button class="btn btn-primary" data-action="approve-photo" data-id="${s.id}">✓ Approve photo (+${item.photoPoints})</button>
        <button class="btn btn-danger" data-action="reject-photo" data-id="${s.id}">✗ Reject photo</button>
      </div>` : `<div class="mod-note">📸 Photo — ${s.photoStatus === 'approved' ? 'already approved ✓' : 'rejected ✗'}</div>`;

          const questionBlock = item.questionPoints <= 0 ? '' : (
            s.questionStatus === 'pending' ? `
      <div class="mod-note">❓ ${esc(item.question)}</div>
      <div class="mod-note">📝 Team answer: ${esc(s.note || '—')}</div>
      ${item.answerKey ? `<div class="answer-key">🔑 Reference: ${esc(item.answerKey)}</div>` : ''}
      <input type="text" class="comment-input" id="question-comment-${s.id}" placeholder="Comment on the answer (optional)">
      <div class="btn-row" style="margin-top:6px;">
        <button class="btn btn-primary" data-action="approve-question" data-id="${s.id}">✓ Approve answer (+${item.questionPoints})</button>
        <button class="btn btn-danger" data-action="reject-question" data-id="${s.id}">✗ Reject answer</button>
      </div>` : `<div class="mod-note">❓ Answer — ${s.questionStatus === 'approved' ? 'already approved ✓' : 'rejected ✗'}</div>`
          );

          return `
    <div class="card mod-card">
      <div class="mod-header">
        <span class="plaque-badge">${esc(s.teamName)}</span>
        <span class="muted">${esc(item ? item.name : s.itemId)}</span>
      </div>
      <img class="thumb" src="${s.photo}">
      ${photoBlock}
      ${questionBlock}
    </div>`;
        }).join('');

        const pendingPlaquesHtml = pendingPlaques.map(s => {
          const item = getItem(s.itemId);
          return `
    <div class="card mod-card">
      <div class="mod-header">
        <span class="plaque-badge">${esc(s.teamName)}</span>
        <span class="muted">${esc(item ? item.name : s.itemId)}</span>
      </div>
      <img class="thumb" src="${s.photo}">
      <div class="mod-note">📝 ${esc(s.note || '—')}</div>
      <input type="text" class="comment-input" id="comment-${s.id}" placeholder="Comment (optional, visible to the team)">
      <div class="btn-row" style="margin-top:8px;">
        <button class="btn btn-primary" data-action="approve-plaque" data-id="${s.id}">✓ Approve (+${item.points})</button>
        <button class="btn btn-danger" data-action="reject-plaque" data-id="${s.id}">✗ Reject</button>
      </div>
    </div>`;
        }).join('');

        const pendingHtml = (pendingNormalHtml + pendingPlaquesHtml) ? (pendingNormalHtml + pendingPlaquesHtml) : `<div class="empty-state">Nothing waiting for review 🎉</div>`;

        const doneNormalHtml = doneNormal.map(s => {
          const item = getItem(s.itemId);
          return `
    <div class="card mod-card">
      <div class="mod-header">
        <span class="plaque-badge">${esc(s.teamName)}</span>
        <span class="muted">${esc(item ? item.name : s.itemId)}</span>
      </div>
      <div class="rank-row" style="padding-top:0;">
        <span class="status-pill ${s.photoStatus}">Photo ${s.photoStatus === 'approved' ? '✓ Approved' : '✗ Rejected'}</span>
        ${item.questionPoints > 0 ? `<span class="status-pill ${s.questionStatus}">Answer ${s.questionStatus === 'approved' ? '✓ Approved' : '✗ Rejected'}</span>` : ''}
      </div>
      <label style="margin-top:6px;display:block;">Comment on the photo</label>
      <div style="display:flex;gap:6px;">
        <input type="text" id="photoComment-note-input-${s.id}" value="${esc(s.photoComment || '')}" placeholder="Message for the team about their photo">
        <button class="btn btn-secondary" data-action="send-comment" data-id="${s.id}" data-field="photoComment">Send</button>
      </div>
      ${item.questionPoints > 0 ? `
      <label style="margin-top:6px;display:block;">Comment on the answer</label>
      <div style="display:flex;gap:6px;">
        <input type="text" id="questionComment-note-input-${s.id}" value="${esc(s.questionComment || '')}" placeholder="Message for the team about their answer">
        <button class="btn btn-secondary" data-action="send-comment" data-id="${s.id}" data-field="questionComment">Send</button>
      </div>`: ''}
    </div>`;
        }).join('');

        const donePlaquesHtml = donePlaques.map(s => {
          const item = getItem(s.itemId);
          return `
    <div class="rank-row">
      <div>
        <span class="plaque-badge">${esc(s.teamName)}</span>
        <span class="muted"> · ${esc(item ? item.name : s.itemId)}</span>
      </div>
      <div class="rank-score">
        <span class="status-pill ${s.status}">${s.status === 'approved' ? 'Approved' : 'Rejected'}</span>
      </div>
    </div>`;
        }).join('');

        const doneCount = doneNormal.length + donePlaques.length;
        const doneHtml = doneNormalHtml + donePlaquesHtml;

        return `
    ${renderStorageBanner()}
    ${huntControl}
    <div class="card">
      <h2>Teams &amp; arrivals</h2>
      ${teamsHtml}
    </div>
    <div class="card">
      <h2><span class="live-dot"></span>Review queue</h2>
      <p class="muted">Photo and answer are approved or rejected separately — points are only credited for the parts you approve.</p>
    </div>
    ${pendingHtml}
    <div class="card">
      <h3>History (${doneCount})</h3>
      ${doneHtml || '<p class="muted">Nothing yet.</p>'}
    </div>
    <div class="card" style="border-color:var(--alerte);">
      <h3 style="color:var(--alerte);">Danger zone</h3>
      <p class="muted">Deletes every team and submission for everyone — use this before a fresh run of the hunt.</p>
      <button class="btn btn-danger" data-action="reset-game">Reset everything</button>
    </div>`;
      }

      function render() {
        const body =
          state.tab === 'home' ? renderHome() :
            state.tab === 'missions' ? renderMissions() :
              state.tab === 'add-missions' ? renderAdditionalMissions() :
                state.tab === 'leaderboard' ? renderLeaderboard() :
                  renderAdmin();

        document.getElementById('app').innerHTML = renderHeader() + body +
          `<div class="footer-note">Made for hEART 2026 with love</div>`;

        if (state.tab === 'missions') {
          initMissionMap();
        }
      }

      /* ============================= EVENTS ============================= */
      document.addEventListener('click', function (e) {
        const btn = e.target.closest('[data-action]');
        if (!btn) return;
        const action = btn.dataset.action;

        if (action === 'switch-tab') { setTab(btn.dataset.tab); return; }
        if (action === 'random-name') { pickRandomName(); return; }
        if (action === 'create-team') { createTeam(); return; }
        if (action === 'select-team') { selectTeam(btn.dataset.id); return; }
        if (action === 'submit-item') { submitItem(btn.dataset.item); return; }
        if (action === 'modo-unlock') { tryUnlockModo(); return; }
        if (action === 'approve-photo') { moderatePhoto(btn.dataset.id, 'approved'); return; }
        if (action === 'reject-photo') { moderatePhoto(btn.dataset.id, 'refused'); return; }
        if (action === 'approve-question') { moderateQuestion(btn.dataset.id, 'approved'); return; }
        if (action === 'reject-question') { moderateQuestion(btn.dataset.id, 'refused'); return; }
        if (action === 'approve-plaque') { moderateRepeatable(btn.dataset.id, 'approved'); return; }
        if (action === 'reject-plaque') { moderateRepeatable(btn.dataset.id, 'refused'); return; }
        if (action === 'start-hunt') { startHunt(); return; }
        if (action === 'mark-arrived') { markArrived(btn.dataset.id, true); return; }
        if (action === 'unmark-arrived') { markArrived(btn.dataset.id, false); return; }
        if (action === 'reset-game') { resetGame(); return; }
      });

      document.addEventListener('change', function (e) {
        if (e.target && e.target.matches('input[type=file][data-item]')) {
          if (e.target.files && e.target.files[0]) revealItem(e.target.dataset.item);
        }
      });

      /* live chrono tick in header without full re-render */
      setInterval(() => {
        const wrap = document.getElementById('chrono-wrap');
        if (!wrap || !state.game.startedAt) return;
        const remaining = state.game.startedAt + HUNT_DURATION_MS - Date.now();
        const low = remaining < 15 * 60 * 1000;
        wrap.className = (remaining <= 0 || low) ? 'low' : '';
        wrap.textContent = '⏱ ' + (remaining <= 0 ? "Time's up — head to Jussieu!" : fmtElapsed(remaining) + ' left');
      }, 1000);

      /* ============================= INIT ============================= */
      async function init() {
        await checkStorage();
        render();
        if (state.storageOk) {
          attachLiveListeners();
        }
      }
      init();

    })();
  </script>
</body>

</html>
